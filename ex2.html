<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercício 2</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-cyan-700 p-5">
        <nav class="flex flex-row flex-wrap justify-center gap-4 md:gap-16">

            <a href="index.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">1</div>
            </a>

            <a href="ex2.html" class="font-extrabold text-2xl text-white">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-cyan-900">2</div>
            </a>

            <a href="ex3.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">3</div>
            </a>

            <a href="ex4.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">4</div>
            </a>

            <a href="ex5.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">5</div>
            </a>

            <a href="ex6.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">6</div>
            </a>

        </nav>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">

        <div class="flex flex-col justify-center items-center gap-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-center">Folha de pagamento</h1>
            <p class="text-xl md:text-2xl">Exercício 2</p>
        </div>

        <!-- Salário mínimo-->
        <section id="secSalarioMinimo" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6">
            <h2 class="text-lg font-bold mb-3">Salário mínimo atual</h2>

            <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1" for="salarioMinimoInput">Salário mínimo (R$)</label>
                    <input type="number" id="salarioMinimoInput" min="0.01" step="0.01" placeholder="Ex: 1518.00"
                           class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-cyan-700">
                </div>
                <button id="btnDefinirSalarioMinimo"
                        class="bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                    Definir
                </button>
            </div>

            <p id="msgSalarioMinimo" class="text-sm mt-3"></p>
        </section>

        <!-- Cadastro funcionário-->
        <section id="secFuncionario" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 opacity-40 pointer-events-none transition">
            <h2 class="text-lg font-bold mb-1">Cadastrar funcionário</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codigoFuncionario">Código do funcionário</label>
                    <input type="text" id="codigoFuncionario" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="horasMes">Horas trabalhadas mensais</label>
                    <input type="number" id="horasMes" min="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="turnoFunc">Turno de trabalho</label>
                    <select id="turnoFunc" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="M">Matutino</option>
                        <option value="V">Vespertino</option>
                        <option value="N">Noturno</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="categoriaFuncionario">Categoria</label>
                    <select id="categoriaFuncionario" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="F">Funcionário Operacional</option>
                        <option value="G">Gerente</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="avalFuncionario">Avaliação de desempenho mensal (0 a 10)</label>
                    <input type="number" id="avalFuncionario" min="0" max="10" step="0.01" class="w-full border border-gray-300 rounded-lg p-2" placeholder="Ex: 7">
                </div>

            </div>

            <p id="msgFuncionario" class="text-sm mt-3 text-red-600"></p>

            <button id="btnAdicionarFunc"
                    class="mt-4 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Adicionar funcionário
            </button>
        </section>

        <!-- Lista de funcionários cadastrados-->
        <section id="secLista" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 hidden">
            <h2 class="text-lg font-bold mb-4">Funcionários cadastrados (<span id="contadorFuncionarios">0</span>)</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Código</th>
                            <th class="py-2 pr-4">Categoria</th>
                            <th class="py-2 pr-4">Turno</th>
                            <th class="py-2 pr-4">Avaliação</th>
                            <th class="py-2 pr-4">Salário final</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFuncionarios"></tbody>
                </table>
            </div>

            <button id="btnGerarRelatorio"
                    class="mt-5 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Gerar relatório
            </button>
        </section>

        <!-- relatório final-->
        <section id="secRelatorio" class="bg-white rounded-2xl shadow-md p-5 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-4">Relatório final</h2>
            <div id="relatorioConteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm"></div>
        </section>

    </main>

    <script src="js/script2.js"></script>
</body>
</html>
