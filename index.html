<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercício 1 - Frete com múltiplos pedidos</title>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-cyan-700 p-5">
        <nav class="flex flex-row flex-wrap justify-center gap-4 md:gap-16">

            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-cyan-900">
                <a href="index.html" class="font-extrabold text-2xl text-white">1</a>
            </div>
            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">
                <a href="ex2.html" class="font-extrabold text-xl">2</a>
            </div>
            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">
                <a href="ex3.html" class="font-extrabold text-xl">3</a>
            </div>
            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">
                <a href="ex4.html" class="font-extrabold text-xl">4</a>
            </div>
            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">
                <a href="ex5.html" class="font-extrabold text-xl">5</a>
            </div>
            <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">
                <a href="ex6.html" class="font-extrabold text-xl">6</a>
            </div>

        </nav>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">

        <div class="flex flex-col justify-center items-center gap-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-center">Empresa Metalmecânica</h1>
            <p class="text-xl md:text-2xl">Exercício 1</p>
        </div>

        <!--Combutível-->
        <section id="secCombustivel" class="bg-white rounded-2xl shadow p-5 md:p-6 mb-6">
            <h2 class="text-lg font-bold mb-3">Preço do combustível</h2>

            <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1" for="precoCombustivel">Preço do litro</label>
                    <input type="number" id="precoCombustivel" min="0.01" step="0.01" placeholder="Ex: 5.89"
                           class="w-full border border-gray-300 rounded-lg p-2.5">
                </div>
                <button id="btnDefinirCombustivel"
                        class="bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2 rounded-lg transition">
                    Definir
                </button>
            </div>

            <p id="msgCombustivel" class="text-sm mt-3"></p>
        </section>

        <!--pedido-->
        <section id="secPedido" class="bg-white rounded-2xl shadow p-5 md:p-6 mb-6 opacity-40 pointer-events-none transition">
            <h2 class="text-lg font-bold mb-1">Adicionar pedido</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codigoPedido">Código do pedido</label>
                    <input type="text" id="codigoPedido"
                           class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="quantidadePecas">Quantidade de peças</label>
                    <input type="number" id="quantidadePecas" min="1"
                           class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="regiao">Região</label>
                    <select id="regiao"
                            class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="1">Sudeste - R$ 1,20/peça</option>
                        <option value="2">Sul - R$ 1,30/peça</option>
                        <option value="3">Centro-Oeste - R$ 1,50/peça</option>
                    </select>
                </div>

                <div>
                    <span class="block text-sm font-semibold mb-1">Deseja rastreamento?</span>
                    <div class="flex gap-6 mt-2.5">
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="rastreamento" value="sim" class="w-4 h-4">
                            Sim (R$ 200,00 fixos)
                        </label>
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="rastreamento" value="nao" class="w-4 h-4" checked>
                            Não
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="distancia">Distância (km)</label>
                    <input type="number" id="distancia" min="1" placeholder="Ex: 350"
                           class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-cyan-700">
                </div>

            </div>

            <p id="msgPedido" class="text-sm mt-3 text-red-600"></p>

            <button id="btnAdicionarPedido"
                    class="mt-4 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Adicionar pedido
            </button>
        </section>

        <!--lista de pedidos-->
        <section id="secLista" class="bg-white rounded-2xl shadow p-5 md:p-6 mb-6 hidden">
            <h2 class="text-lg font-bold mb-4">Pedidos (<span id="contadorPedidos">0</span>)</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Código</th>
                            <th class="py-2 pr-4">Região</th>
                            <th class="py-2 pr-4">Km</th>
                            <th class="py-2 pr-4">Peças</th>
                            <th class="py-2 pr-4">Rastreio</th>
                            <th class="py-2 pr-4">Total</th>
                            <th class="py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPedidos"></tbody>
                </table>
            </div>

            <button id="btnGerarRelatorio"
                    class="mt-5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Gerar relatório final
            </button>
        </section>

        <!-- ===================== RELATÓRIO FINAL ===================== -->
        <section id="secRelatorio" class="bg-white rounded-2xl shadow p-5 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-4">Relatório final</h2>
            <div id="relatorioConteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm"></div>
        </section>

    </main>

<script>
// dados salvos na memória da página
var precoCombustivel = null;
var pedidos = [];
var nomesRegiao = { "1": "Sudeste", "2": "Sul", "3": "Centro-Oeste" };

// 1) define o preço do combustível
function definirCombustivel() {
    var valor = parseFloat(document.getElementById("precoCombustivel").value);
    if (isNaN(valor) || valor <= 0) {
        document.getElementById("msgCombustivel").textContent = "Preço inválido.";
        return;
    }
    precoCombustivel = valor;
    document.getElementById("msgCombustivel").textContent = "Combustível definido: R$ " + valor.toFixed(2);
    document.getElementById("secPedido").classList.remove("opacity-40", "pointer-events-none");
}

// preço da peça por região (switch-case pedido no enunciado)
function precoPorPeca(regiao) {
    switch (regiao) {
        case "1": return 1.20;
        case "2": return 1.30;
        case "3": return 1.50;
        default: return null;
    }
}

// verifica código repetido (while pedido no enunciado)
function codigoJaExiste(codigo) {
    var i = 0;
    while (i < pedidos.length) {
        if (pedidos[i].codigo === codigo) return true;
        i++;
    }
    return false;
}

// valor das peças, com 12% de desconto acima de 1000 unidades
function calcularValorPecas(qtd, preco) {
    if (qtd <= 1000) return qtd * preco;
    var excedente = qtd - 1000;
    return (1000 * preco) + (excedente * preco * 0.88);
}

// 2) adiciona um pedido à lista
function adicionarPedido() {
    var codigo = document.getElementById("codigoPedido").value.trim();
    var regiao = document.getElementById("regiao").value;
    var distancia = parseFloat(document.getElementById("distancia").value);
    var qtd = parseInt(document.getElementById("quantidadePecas").value, 10);
    var rastreio = document.querySelector('input[name="rastreamento"][value="sim"]').checked;

    var preco = precoPorPeca(regiao);
    var msg = document.getElementById("msgPedido");

    if (!codigo || codigoJaExiste(codigo) || !preco || !distancia || !qtd) {
        msg.textContent = "Preencha tudo corretamente (código único, região, distância e peças > 0).";
        return;
    }

    var total = calcularValorPecas(qtd, preco) + (distancia * precoCombustivel) + (rastreio ? 200 : 0);

    pedidos.push({ codigo: codigo, regiao: regiao, distancia: distancia, qtd: qtd, rastreio: rastreio, total: total });

    mostrarTabela();
    document.getElementById("codigoPedido").value = "";
    document.getElementById("regiao").value = "";
    document.getElementById("distancia").value = "";
    document.getElementById("quantidadePecas").value = "";
    msg.textContent = "";
}

// redesenha a tabela de pedidos
function mostrarTabela() {
    document.getElementById("secLista").classList.remove("hidden");
    document.getElementById("contadorPedidos").textContent = pedidos.length;

    var html = "";
    for (var i = 0; i < pedidos.length; i++) {
        var p = pedidos[i];
        html += "<tr class='border-b border-gray-100'>" +
            "<td class='py-2 pr-4'>" + p.codigo + "</td>" +
            "<td class='py-2 pr-4'>" + nomesRegiao[p.regiao] + "</td>" +
            "<td class='py-2 pr-4'>" + p.distancia + " km</td>" +
            "<td class='py-2 pr-4'>" + p.qtd + "</td>" +
            "<td class='py-2 pr-4'>" + (p.rastreio ? "Sim" : "Não") + "</td>" +
            "<td class='py-2 pr-4 font-semibold'>R$ " + p.total.toFixed(2) + "</td>" +
            "<td class='py-2'><button onclick='removerPedido(" + i + ")' class='text-red-600 text-xs hover:underline'>remover</button></td></tr>";
    }
    document.getElementById("tabelaPedidos").innerHTML = html;
}

function removerPedido(i) {
    pedidos.splice(i, 1);
    mostrarTabela();
    document.getElementById("secRelatorio").classList.add("hidden");
}

// 3) gera o relatório final
function gerarRelatorio() {
    if (pedidos.length === 0) return;

    var soma = 0, r1 = 0, r2 = 0, r3 = 0;
    var maisCaro = pedidos[0], maisBarato = pedidos[0];

    for (var i = 0; i < pedidos.length; i++) {
        var p = pedidos[i];
        soma += p.total;
        if (p.regiao === "1") r1 += p.total;
        if (p.regiao === "2") r2 += p.total;
        if (p.regiao === "3") r3 += p.total;
        if (p.total > maisCaro.total) maisCaro = p;
        if (p.total < maisBarato.total) maisBarato = p;
    }

    var media = soma / pedidos.length;

    document.getElementById("relatorioConteudo").innerHTML =
        "<div class='bg-gray-50 rounded-xl p-4'><p class='text-gray-500'>Total de pedidos</p><p class='text-xl font-bold'>" + pedidos.length + "</p></div>" +
        "<div class='bg-gray-50 rounded-xl p-4'><p class='text-gray-500'>Valor médio</p><p class='text-xl font-bold'>R$ " + media.toFixed(2) + "</p></div>" +
        "<div class='bg-gray-50 rounded-xl p-4 sm:col-span-2'><p class='text-gray-500 mb-1'>Total por região</p>" +
        "<p>Sudeste: R$ " + r1.toFixed(2) + "</p><p>Sul: R$ " + r2.toFixed(2) + "</p><p>Centro-Oeste: R$ " + r3.toFixed(2) + "</p></div>" +
        "<div class='bg-emerald-50 rounded-xl p-4'><p class='text-gray-500'>Mais caro</p><p class='text-lg font-bold'>" + maisCaro.codigo + "</p><p>R$ " + maisCaro.total.toFixed(2) + "</p></div>" +
        "<div class='bg-amber-50 rounded-xl p-4'><p class='text-gray-500'>Mais barato</p><p class='text-lg font-bold'>" + maisBarato.codigo + "</p><p>R$ " + maisBarato.total.toFixed(2) + "</p></div>";

    document.getElementById("secRelatorio").classList.remove("hidden");
    document.getElementById("secRelatorio").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("btnDefinirCombustivel").addEventListener("click", definirCombustivel);
document.getElementById("btnAdicionarPedido").addEventListener("click", adicionarPedido);
document.getElementById("btnGerarRelatorio").addEventListener("click", gerarRelatorio);
</script>

</body>
</html>
