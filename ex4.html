<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercício 4</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-cyan-700 p-5">
        <nav class="flex flex-row flex-wrap justify-center gap-4 md:gap-16">

            <a href="index.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">1</div>
            </a>

            <a href="ex2.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">2</div>
            </a>

            <a href="ex3.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">3</div>
            </a>

            <a href="ex4.html" class="font-extrabold text-2xl text-white">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-cyan-900">4</div>
            </a>

            <a href="ex5.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">5</div>
            </a>

            <a href="ex6.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">6</div>
            </a>

        </nav>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">

        <div class="flex flex-col justify-center items-center gap-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-center">Reservas de Hotel</h1>
            <p class="text-xl md:text-2xl">Exercício 4</p>
        </div>

        <!-- Configurações iniciais -->
        <section id="secConfig" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6">
            <h2 class="text-lg font-bold mb-3">Configuração inicial</h2>

            <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1" for="valorDia">Diária padrão (R$)</label>
                    <input type="number" id="valorDia" min="0.01" step="0.01" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-cyan-700">
                </div>

                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1" for="valorCafeDia">Café da manhã por hóspede/dia (R$)</label>
                    <input type="number" id="valorCafeDia" min="0.01" step="0.01" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-cyan-700">
                </div>

                <button id="btnDefinirConfig" class="bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                    Definir
                </button>
            </div>

            <p id="msgConfig" class="text-sm mt-3"></p>
        </section>

        <!-- Cadastro de reservas -->
        <section id="secReserva" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 opacity-40 pointer-events-none transition">
            <h2 class="text-lg font-bold mb-1">Cadastrar reserva</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codigoReserva">Código da reserva</label>
                    <input type="text" id="codigoReserva" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="tipoQuarto">Tipo de quarto</label>
                    <select id="tipoQuarto" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="S">Standard</option>
                        <option value="L">Luxo</option>
                        <option value="P">Premium</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="temporada">Temporada</label>
                    <select id="temporada" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="B">Baixa</option>
                        <option value="A">Alta</option>
                        <option value="F">Feriado</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="quantDiaria">Quantidade de diárias</label>
                    <input type="number" id="quantDiaria" min="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="numHospede">Número de hóspedes</label>
                    <input type="number" id="numHospede" min="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <span class="block text-sm font-semibold mb-1">Café da manhã incluso?</span>
                    <div class="flex gap-6 mt-2.5">
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="cafeIncluso" value="sim" class="w-4 h-4">
                            Sim
                        </label>
                        <label class="flex items-center gap-2 text-sm">
                            <input type="radio" name="cafeIncluso" value="nao" class="w-4 h-4" checked>
                            Não
                        </label>
                    </div>
                </div>

            </div>

            <p id="msgReserva" class="text-sm mt-3 text-red-600"></p>

            <button id="btnAdicionarReserva"
                    class="mt-4 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Adicionar reserva
            </button>
        </section>

        <!-- lista de reservas-->
        <section id="secLista" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 hidden">
            <h2 class="text-lg font-bold mb-4">Reservas cadastradas (<span id="contadorReservas">0</span>)</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 ">
                            <th class="py-2 pr-4">Código</th>
                            <th class="py-2 pr-4">Tipo</th>
                            <th class="py-2 pr-4">Temporada</th>
                            <th class="py-2 pr-4">Diárias</th>
                            <th class="py-2 pr-4">Hóspedes</th>
                            <th class="py-2 pr-4">Café</th>
                            <th class="py-2 pr-4">Valor total</th>
                            <th class="py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaReservas"></tbody>
                </table>
            </div>

            <button id="btnGerarRelatorio"
                    class="mt-5 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Gerar relatório final
            </button>
        </section>

        <!-- Relatório -->
        <section id="secRelatorio" class="bg-white rounded-2xl shadow-md p-5 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-4">Relatório final</h2>
            <div id="relatorioConteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm"></div>
        </section>

    </main>

    <script src="script4.js"></script>
</body>
</html>
