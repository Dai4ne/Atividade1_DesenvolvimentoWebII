<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercício 3</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-cyan-700 p-5">
        <nav class="flex flex-row flex-wrap justify-center gap-4 md:gap-16">

            <a href="index.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">1</div>
            </a>

            <a href="ex2.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">2</div>
            </a>

            <a href="ex3.html" class="font-extrabold text-2xl text-white">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-cyan-900">3</div>
            </a>

            <a href="ex4.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">4</div>
            </a>

            <a href="ex5.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">5</div>
            </a>

            <a href="ex6.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">6</div>
            </a>

        </nav>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">

        <div class="flex flex-col justify-center items-center gap-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-center">Controle de Produção com Estoque</h1>
            <p class="text-xl md:text-2xl">Exercício 3</p>
        </div>

        <!-- Cadastro de produção-->
        <section id="secProducao" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6">
            <h2 class="text-lg font-bold mb-1">Cadastrar ordem de produção</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codOrdem">Código da ordem</label>
                    <input type="text" id="codOrdem" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codProduto">Código do produto</label>
                    <input type="text" id="codProduto" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="tipoProduto">Tipo de produto</label>
                    <select id="tipoProduto" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="1">Padrão</option>
                        <option value="2">Premium</option>
                        <option value="3">Sob encomenda</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="quantidade">Quantidade produzida</label>
                    <input type="number" id="quantidade" min="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="custoUnitario">Custo unitário de produção (R$)</label>
                    <input type="number" id="custoUnitario" min="0.01" step="0.01" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="estoqueInicial">Estoque inicial do produto</label>
                    <input type="number" id="estoqueInicial" min="0" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

            </div>

            <p id="msgOrdem" class="text-sm mt-3 text-red-600"></p>

            <button id="btnAdicionarOrdem"
                    class="mt-4 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Adicionar ordem
            </button>
        </section>

        <!--Ordens cadastradas-->
        <section id="secLista" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 hidden">
            <h2 class="text-lg font-bold mb-4">Ordens cadastradas (<span id="contadorOrdens">0</span>)</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Ordem</th>
                            <th class="py-2 pr-4">Produto</th>
                            <th class="py-2 pr-4">Tipo</th>
                            <th class="py-2 pr-4">Estoque final</th>
                            <th class="py-2 pr-4">Alerta</th>
                            <th class="py-2 pr-4">Custo total</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaOrdens"></tbody>
                </table>
            </div>

            <button id="btnGerarRelatorio"
                    class="mt-5 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Gerar relatório
            </button>
        </section>

        <!-- relatório-->
        <section id="secRelatorio" class="bg-white rounded-2xl shadow-md p-5 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-4">Relatório final</h2>
            <div id="relatorioConteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm mb-6"></div>

            <h3 class="text-md font-bold mb-3">Estoque geral de produto(s)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Produto</th>
                            <th class="py-2 pr-4">Estoque final consolidado</th>
                            <th class="py-2 pr-4">Valor total investido</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script3.js"></script>

</body>
</html>
