<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercício 5</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-cyan-700 p-5">
        <nav class="flex flex-row flex-wrap justify-center gap-4 md:gap-16">

            <a href="index.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">1</div>
            </a>

            <a href="ex2.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">2</div>
            </a>

            <a href="ex3.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">3</div>
            </a>

            <a href="ex4.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">4</div>
            </a>

            <a href="ex5.html" class="font-extrabold text-2xl text-white">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-cyan-900">5</div>
            </a>

            <a href="ex6.html" class="font-extrabold text-xl">
                <div class="flex justify-center items-center w-14 h-14 rounded-xl bg-white">6</div>
            </a>

        </nav>
    </header>

    <main class="p-4 md:p-8 max-w-5xl mx-auto">

        <div class="flex flex-col justify-center items-center gap-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-center">Treinos Esportivos com Risco de Lesão</h1>
            <p class="text-xl md:text-2xl">Exercício 5</p>
        </div>

        <!--Configurações inicias -->
        <section id="secConfig" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6">
            <h2 class="text-lg font-bold mb-3">Configuração inicial</h2>

            <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1" for="cargaMaxima">Carga máxima semanal recomendada (pontos)</label>
                    <input type="number" id="cargaMaxima" min="0.01" step="0.01" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-cyan-700">
                </div>

                <button id="btnDefinirConfig"
                        class="bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                    Definir
                </button>
            </div>

            <p id="msgConfig" class="text-sm mt-3"></p>
        </section>

        <!-- Cadastro de treino -->
        <section id="secTreino" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 opacity-40 pointer-events-none transition">
            <h2 class="text-lg font-bold mb-1">Cadastrar treino</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

                <div>
                    <label class="block text-sm font-semibold mb-1" for="codigoTreino">Código do treino</label>
                    <input type="text" id="codigoTreino" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="nomeJogador">Nome do jogador</label>
                    <input type="text" id="nomeJogador" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="posicaoJogador">Posição</label>
                    <select id="posicaoJogador" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="G">Goleiro</option>
                        <option value="Z">Zagueiro</option>
                        <option value="M">Meio-campo</option>
                        <option value="A">Atacante</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="tipoTreino">Tipo de treino</label>
                    <select id="tipoTreino" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="">Selecione</option>
                        <option value="F">Físico</option>
                        <option value="T">Técnico</option>
                        <option value="E">Estratégico</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="duracaoMin">Duração (minutos)</label>
                    <input type="number" id="duracaoMin" min="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1" for="intensidade">Intensidade (1 a 10)</label>
                    <input type="number" id="intensidade" min="1" max="10" step="1" class="w-full border border-gray-300 rounded-lg p-2">
                </div>

            </div>

            <p id="msgTreino" class="text-sm mt-3 text-red-600"></p>

            <button id="btnAdicionarTreino"
                    class="mt-4 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Adicionar treino
            </button>
        </section>

        <!-- Lista de treinos-->
        <section id="secLista" class="bg-white rounded-2xl shadow-md p-5 md:p-6 mb-6 hidden">
            <h2 class="text-lg font-bold mb-4">Treinos cadastrados (<span id="contadorTreinos">0</span>)</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Código</th>
                            <th class="py-2 pr-4">Jogador</th>
                            <th class="py-2 pr-4">Posição</th>
                            <th class="py-2 pr-4">Tipo</th>
                            <th class="py-2 pr-4">Duração</th>
                            <th class="py-2 pr-4">Intensidade</th>
                            <th class="py-2 pr-4">Carga</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTreinos"></tbody>
                </table>
            </div>

            <button id="btnGerarRelatorio"
                    class="mt-5 bg-cyan-700 hover:bg-cyan-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
                Gerar relatório
            </button>
        </section>

        <!-- Relatório -->
        <section id="secRelatorio" class="bg-white rounded-2xl shadow-md p-5 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-4">Relatório final</h2>
            <div id="relatorioConteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm mb-6"></div>

            <h3 class="text-md font-bold mb-3">Carga semanal por jogador</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500">
                            <th class="py-2 pr-4">Jogador</th>
                            <th class="py-2 pr-4">Posição</th>
                            <th class="py-2 pr-4">Treinos</th>
                            <th class="py-2 pr-4">Carga semanal</th>
                            <th class="py-2 pr-4">Risco de lesão</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaJogadores"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/script5.js"></script>
</body>
</html>
